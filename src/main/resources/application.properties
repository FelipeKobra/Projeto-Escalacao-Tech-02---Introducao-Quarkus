# =============================================================================
# eventos-api — configuração base. Profiles: %dev (quarkus:dev), %test (testes)
# e %prod (java -jar). Qualquer chave pode ser sobrescrita por variável de
# ambiente: troque "." e "-" por "_" e use maiúsculas
# (ex.: quarkus.datasource.jdbc.url -> QUARKUS_DATASOURCE_JDBC_URL).
# =============================================================================
quarkus.application.name=eventos-api
quarkus.http.port=8080
# Porta aleatória nos testes, para não colidir com a API ou o mock rodando.
quarkus.http.test-port=0

# ---------- Banco: H2 (relacional, sem Docker) ----------
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
# dev/test: em memória, recriado a cada start, com os dados de import.sql.
quarkus.datasource.jdbc.url=jdbc:h2:mem:eventos;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
# prod: H2 em arquivo, os dados sobrevivem ao restart.
%prod.quarkus.datasource.jdbc.url=jdbc:h2:file:./data/eventos;DB_CLOSE_DELAY=-1
%prod.quarkus.hibernate-orm.schema-management.strategy=update

# ---------- OpenAPI / Swagger UI (/q/swagger-ui) ----------
quarkus.swagger-ui.always-include=true

# ---------- Rest client ----------
quarkus.rest-client.enderecos-api.url=http://localhost:8081
